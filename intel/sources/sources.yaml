# Treya's Intel Source Directory
# Purpose: Define data streams for briefing and ad-hoc queries.

intel_sources:
  threat_intelligence:
    description: "These sources provide high-signal technical advisories and vendor research."
    feeds:
      - name: "Microsoft Security"
        url: "https://www.microsoft.com/en-us/security/blog/feed/"
        type: "rss"
      - name: "Unit 42 (Palo Alto)"
        url: "https://unit42.paloaltonetworks.com/feed/"
        type: "rss"
      - name: "FortiGuard Center (Outbreak Alerts)"
        url: "https://filestore.fortinet.com/fortiguard/rss/outbreakalert.xml"
        type: "rss"
      - name: "FortiGuard Center (PSIRT Advisories)"
        url: "https://filestore.fortinet.com/fortiguard/rss/ir.xml"
        type: "rss"
      - name: "CISA Alerts"
        url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
        type: "rss"
      - name: "Zero Day Initiative"
        url: "https://www.zerodayinitiative.com/rss/published/"
        type: "rss"
      - name: "Mandiant (Google)"
        url: "https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v"
        type: "rss"
      - name: "Cyberscoop"
        url: "https://cyberscoop.com/feed/"
        type: "rss"

  general_news:
    description: "These sources cover a broader security landscape for initial mid-level research."
    feeds:
      - name: "The Guardian (Technology)"
        url: "https://www.theguardian.com/us/technology/rss"
        type: "rss"
      - name: "Security Review Magazine"
        url: "https://securityreviewmag.com/?feed=rss2"
        type: "rss"
      - name: "CNBC"
        url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=19854910"
        type: "rss"
      - name: "BleepingComputer"
        url: "https://www.bleepingcomputer.com/feed/"
        type: "rss"
      - name: "BankInfoSecurity"
        url: "https://www.bankinfosecurity.com/rss-feeds"
        type: "rss"
      - name: "Dark Reading"
        url: "https://www.darkreading.com/rss.xml"
        type: "rss"
      - name: "The Record by Recorded Future"
        url: "https://therecord.media/feed"
        type: "rss"
      - name: "The Hacker News"
        url: "https://feeds.feedburner.com/TheHackersNews"
        type: "rss"
      - name: "Cybersecurity Dive"
        url: "https://jsonformatter.org/xml-formatter"
        type: "rss"
      - name: "ExtremeTech"
        url: "https://www.extremetech.com/feed"
        type: "rss"
      - name: "SecurityWeek"
        url: "https://www.securityweek.com/feed/"
        type: "rss"
      - name: "Security Boulevard"
        url: "https://securityboulevard.com/feed/"
        type: "rss"
      - name: "HelpNet Security"
        url: "https://www.helpnetsecurity.com/feed/"
        type: "rss"
      - name: "Crowdstrike"
        url: "https://news.google.com/rss/search?q=site%3Acrowdstrike.com%20when%3A7d&hl=en-US&gl=US&ceid=US%3Aen"
        type: "rss"
      - name: "Orca Security"
        url: "https://orca.security/resources/blog/feed/"
        type: "rss"
      - name: "SentinelOne"
        url: "https://www.sentinelone.com/feed/"
        type: "rss"

  org_pages:
    description: "These sources cover specific information that the organization has reported on. These either use the proprietary news feed, or Google News to create an RSS feed out of recent company posts."
    feeds:
      - name: "Crowdstrike"
        url: "https://news.google.com/rss/search?q=site%3Acrowdstrike.com%20when%3A7d&hl=en-US&gl=US&ceid=US%3Aen"
        type: "rss"
      - name: "Orca Security"
        url: "https://orca.security/resources/blog/feed/"
        type: "rss"
      - name: "SentinelOne"
        url: "https://www.sentinelone.com/feed/"
        type: "rss"
      - name: "OpenAI"
        url: "https://openai.com/news/rss.xml"
        type: "rss"
      - name: "Meta"
        url: "https://about.fb.com/feed/"
        type: "rss"

  academic_research:
    description: "Deep-dive papers and emerging AI/Security studies from ArXiv."
    feeds:
      - name: "ArXiv AI Security"
        url: "https://export.arxiv.org/rss/cs"
        type: "rss"

  community_pulse:
    description: "This section is for real-time community discussions and sentiments."
    feeds:
      - name: "r/cybersecurity"
        url: "https://www.reddit.com/r/cybersecurity/new/.json?limit=10"
        type: "json"
      - name: "r/netsec"
        url: "https://www.reddit.com/r/netsec/hot.json?limit=10"
        type: "json"