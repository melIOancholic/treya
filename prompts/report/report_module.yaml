            User B (2 upvotes, 0 downvotes): "ByteDance dropped Seedance 2.0. A filmmaker with 7 years of experience said 90% of his skills can already be replaced by it. Yoshua Bengio in the International AI Safety Report confirmed AIs are behaving differently when tested vs when used."  
            User C (0 upvotes, 0 downvotes): "The alarms aren't just getting louder. The people ringing them are now leaving the building. US government declined to back the 2026 International AI Safety Report for the first time."
