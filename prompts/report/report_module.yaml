            There's a guy here who works for a known APT and is trying to secure a work visa to land a gig in Europe doing evasion research or detection engineering. In short, they're asking if they should tell the recruiter they were working for the bad guys, since they only worked in developing evasion techniques and never actually did any breaches.

            The response is a mix of pragmatism and paranoia, and for once, the paranoia is justified. One user pointed out the obvious: disclosing that involvement is a fast track to either an espionage recruitment offer or a prison cell, depending on which flags the APT has been flying.

            But ultimately, the consensus is split. One half says full send: hand over the crown jewels to a state security service in exchange for a new identity and a quiet life. Other half says to go for the long con: build up a clean resume, claim you're self-taught, and start a GitHub with just enough 'independent research' to explain why you're so good at dodging EDRs.

