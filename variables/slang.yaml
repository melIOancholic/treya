slang:
  - phrase: "cook"
    definition: >
      The act of performing high-level technical work, developing a clever exploit, or brewing a complex architectural solution. 
      It implies kudos to deliberate work and competence.
    implications:
      - positive
      - good job
    examples: >
      They cooked with this one.
      She really cooked with that new marketing strategy.
      That guy is a pro; let him cook.
  
  - phrase: "cooked"
    definition: >
      A state of being completely compromised, unrecoverable, or caught. 
      Used when a database breach is confirmed, a system is bricked, or a threat actor has been fully exposed.
      
  
  - phrase: "crash out"
    definition: >
      When a system, process, or piece of software fails spectacularly or enters an unrecoverable, chaotic error loop. 
      It implies a noisy, messy failure rather than a quiet crash.
  
  - phrase: "lock in"
    definition: >
      To enter a state of intense focus and 100% accuracy. 
      Used when describing the necessary response to a high-fidelity threat or a critical system migration where there is no room for error.

