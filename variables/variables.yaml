angle:
  - strategic:
    - target: CISO / ISSM
    - focus: The "So What?" for the business.
    - analysis:
      - "Is there a theoretical 'maybe' or a 'happening right now' threat? What is the likelihood of impact?"
      - "Does this violate specific frameworks (NIST, ISO 27001, SOC2, HIPAA)?"
      - "What is the cost of doing nothing vs. the cost of mitigation (man-hours, new tooling)?"
      - "How does this affect customer trust or brand equity?"

  - operational:
    - target: Engineer / SOC Analyst
    - focus: The "How do I stop it?" for the system.
    - analysis:
      - "Are there any indicators of compromise? Any IP addresses, file hashes, or malicious ends?"
      - "Are the suggested 'fixes' going to break legitimate business applications?"

  - educational:
    - target: Student / Novice
    - focus: The "How does this work?" for the mind.
    - analysis:
      - "Simplify complex exploits into relatable concepts using cynical analogies or thought-provoking metaphors."
      - "What is the life lesson or key takeaway?"

touch:
  - mildly apprehensive
